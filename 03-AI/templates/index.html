<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #16213e; padding: 1rem 2rem; border-bottom: 1px solid #0f3460; }
        header h1 { color: #00d9ff; font-size: 1.4rem; }
        header span { color: #888; font-size: 0.85rem; }
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 1rem; }
        #messages { flex: 1; overflow-y: auto; padding: 1rem 0; }
        .message { margin-bottom: 1rem; padding: 1rem; border-radius: 8px; }
        .user { background: #0f3460; align-self: flex-end; border-left: 3px solid #00d9ff; }
        .ai { background: #16213e; border-left: 3px solid #533483; }
        .message .label { font-size: 0.75rem; color: #00d9ff; margin-bottom: 0.3rem; text-transform: uppercase; }
        .ai .label { color: #533483; }
        .input-area { display: flex; gap: 0.5rem; padding: 1rem 0; }
        #question { flex: 1; padding: 0.8rem 1rem; border: 1px solid #0f3460; border-radius: 8px; background: #16213e; color: #eee; font-size: 1rem; outline: none; }
        #question:focus { border-color: #00d9ff; }
        button { padding: 0.8rem 1.5rem; border: none; border-radius: 8px; background: #00d9ff; color: #1a1a2e; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b8d4; }
        button:disabled { background: #555; cursor: wait; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <h1>Docker AI Assistant</h1>
        <span>Modelo: smollm2 | Docker Model Runner</span>
    </header>
    <div class="chat-container">
        <div id="messages">
            <div class="message ai">
                <div class="label">AI</div>
                <div>Hola! Soy tu asistente de IA. Preguntame lo que quieras sobre Docker.</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="question" placeholder="Escribe tu pregunta..." autofocus>
            <button id="sendBtn" onclick="ask()">Enviar</button>
        </div>
    </div>
    <script>
        const messages = document.getElementById('messages');
        const questionInput = document.getElementById('question');
        const sendBtn = document.getElementById('sendBtn');

        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) ask();
        });

        async function ask() {
            const q = questionInput.value.trim();
            if (!q) return;

            appendMessage('user', q);
            questionInput.value = '';
            sendBtn.disabled = true;

            const loadingDiv = appendMessage('ai', '<span class="loading">Pensando...</span>', true);

            try {
                const res = await fetch(`/ask?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                loadingDiv.querySelector('div:last-child').textContent = data.answer || data.error;
            } catch (err) {
                loadingDiv.querySelector('div:last-child').textContent = 'Error de conexion: ' + err.message;
            }

            sendBtn.disabled = false;
            questionInput.focus();
        }

        function appendMessage(role, content, isHtml = false) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const label = role === 'user' ? 'Tu' : 'AI';
            div.innerHTML = `<div class="label">${label}</div><div>${isHtml ? content : escapeHtml(content)}</div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
